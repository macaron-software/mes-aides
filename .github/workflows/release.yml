name: Mobile Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to release'
        required: true
        default: 'both'
        type: choice
        options: [both, ios, android]
      dry_run:
        description: 'Dry run (build only, no upload)'
        required: false
        default: false
        type: boolean

jobs:
  # ─────────────────────────────────────────────────────────────
  # Extract version from tag
  # ─────────────────────────────────────────────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      build_number: ${{ steps.extract.outputs.build_number }}
    steps:
      - name: Extract version from tag
        id: extract
        run: |
          TAG="${GITHUB_REF_NAME:-v1.0.0}"
          VERSION="${TAG#v}"
          BUILD="${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION  Build: $BUILD"

  # ─────────────────────────────────────────────────────────────
  # iOS → TestFlight
  # ─────────────────────────────────────────────────────────────
  ios:
    needs: version
    if: |
      github.event_name == 'push' ||
      inputs.platform == 'both' ||
      inputs.platform == 'ios'
    runs-on: macos-14
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Setup Ruby + Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Write ASC API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Write iOS signing certificate
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$IOS_CERTIFICATE_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Write provisioning profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > /tmp/mesaides.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/mesaides.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Update version in Xcode project
        working-directory: ios
        run: |
          agvtool new-marketing-version "$VERSION" 2>/dev/null || true
          agvtool new-version -all "$BUILD_NUMBER" 2>/dev/null || true
          echo "✅ iOS version set to $VERSION ($BUILD_NUMBER)"

      - name: Build and upload to TestFlight
        if: ${{ !inputs.dry_run }}
        working-directory: ios
        run: fastlane beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_FILEPATH: ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Build only (dry run)
        if: ${{ inputs.dry_run }}
        working-directory: ios
        run: fastlane test

      - name: Upload metadata to App Store
        if: ${{ !inputs.dry_run }}
        working-directory: ios
        run: |
          fastlane deliver \
            --skip_binary_upload \
            --skip_screenshots \
            --force \
            --metadata_path "./fastlane/metadata" \
            --api_key_path "~/.fastlane/api_key.json" || true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_FILEPATH: ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
        continue-on-error: true

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MesAides-iOS-${{ env.VERSION }}-${{ env.BUILD_NUMBER }}
          path: ios/build/**/*.ipa
          retention-days: 30
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # Android → Play Store internal track
  # ─────────────────────────────────────────────────────────────
  android:
    needs: version
    if: |
      github.event_name == 'push' ||
      inputs.platform == 'both' ||
      inputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Ruby + Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/mesaides-release.keystore
          echo "✅ Keystore decoded"

      - name: Write Google Play service account key
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p android/fastlane
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > android/fastlane/google-play-key.json
          echo "✅ Play service account key written"

      - name: Update versionCode + versionName
        run: |
          sed -i "s/versionName = \".*\"/versionName = \"$VERSION\"/" android/app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = $BUILD_NUMBER/" android/app/build.gradle.kts
          echo "✅ Android version set to $VERSION ($BUILD_NUMBER)"

      - name: Build and upload to Play Store internal
        if: ${{ !inputs.dry_run }}
        working-directory: android
        run: fastlane internal
        env:
          KEYSTORE_PATH: app/mesaides-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build only (dry run)
        if: ${{ inputs.dry_run }}
        working-directory: android
        run: fastlane build
        env:
          KEYSTORE_PATH: app/mesaides-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload AAB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MesAides-Android-${{ env.VERSION }}-${{ env.BUILD_NUMBER }}.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # Summary
  # ─────────────────────────────────────────────────────────────
  summary:
    needs: [version, ios, android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Release summary
        run: |
          echo "## 📱 MesAides Mobile Release ${{ needs.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| iOS TestFlight | ${{ needs.ios.result == 'success' && '✅ Uploaded' || needs.ios.result == 'skipped' && '⏭ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android Play internal | ${{ needs.android.result == 'success' && '✅ Uploaded' || needs.android.result == 'skipped' && '⏭ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build: ${{ needs.version.outputs.build_number }} · Tag: ${GITHUB_REF_NAME}" >> $GITHUB_STEP_SUMMARY
