name: MesAides
options:
  bundleIdPrefix: com.macaron
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/MesAides/Generated"
    OTHER_LDFLAGS: "$(inherited) -laides_core -lc++"
    SWIFT_USE_INTEGRATED_DRIVER: NO

targets:
  MesAides:
    type: application
    platform: iOS
    sources:
      - path: MesAides/Sources/MesAides
      - path: MesAides/Sources/MesAidesCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macaron.aida
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MesAides
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchStoryboardName: ""
        SWIFT_OBJC_BRIDGING_HEADER: MesAides/Sources/MesAides/MesAides-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/MesAides/Generated $(inherited)"

schemes:
  MesAides:
    build:
      targets:
        MesAides: all
    run:
      config: Debug
    archive:
      config: Release
