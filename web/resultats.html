<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- theme anti-flash — doit être AVANT le CSS -->
  <script src="/js/theme-init.js"></script>
  <title data-i18n="results.page_title">Vos aides — Mes Aides France</title>
  <meta name="description" content="Vos aides sociales calculees gratuitement. Plan d'action pour chaque demarche.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://aides.macaron-software.com/simulateur.html">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    /* ── Results layout ── */
    .results-header {
      background: var(--c-primary);
      color: #fff;
      padding: var(--sp-12) var(--sp-4);
      text-align: center;
    }

    .results-header h1 {
      font-size: var(--fs-3xl);
      font-weight: 800;
      margin-bottom: var(--sp-2);
    }

    .results-header p {
      font-size: var(--fs-lg);
      opacity: 0.85;
    }

    .results-total {
      display: inline-flex;
      align-items: baseline;
      gap: var(--sp-2);
      background: rgba(255,255,255,.15);
      border-radius: var(--r-xl);
      padding: var(--sp-4) var(--sp-8);
      margin-top: var(--sp-6);
    }

    .results-total-amount {
      font-size: var(--fs-4xl);
      font-weight: 900;
    }

    .results-total-label {
      font-size: var(--fs-base);
      opacity: 0.8;
    }

    .results-body {
      max-width: var(--max-content);
      margin: 0 auto;
      padding: var(--sp-10) var(--sp-4) var(--sp-16);
    }

    /* ── Aide card ── */
    .aide-card {
      background: var(--c-surface);
      border-radius: var(--r-xl);
      box-shadow: var(--sh-md);
      margin-bottom: var(--sp-5);
      overflow: hidden;
    }

    .aide-card-header {
      display: flex;
      align-items: center;
      gap: var(--sp-4);
      padding: var(--sp-5) var(--sp-6);
      cursor: pointer;
      transition: background var(--tr);
    }

    .aide-card-header:hover { background: var(--c-bg); }

    .aide-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--r-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .aide-icon.revenus  { background: var(--c-success-light); color: var(--c-success); }
    .aide-icon.logement { background: var(--c-info-light);    color: var(--c-info); }
    .aide-icon.handicap { background: var(--c-warning-light); color: var(--c-warning); }
    .aide-icon.energie  { background: var(--c-accent-light);  color: var(--c-accent-hover); }
    .aide-icon.sante    { background: var(--c-danger-light);  color: var(--c-danger); }
    .aide-icon.famille  { background: var(--c-primary-light); color: var(--c-primary); }

    .aide-info { flex: 1; }

    .aide-name {
      font-size: var(--fs-base);
      font-weight: 700;
      color: var(--c-text);
    }

    .aide-amount-badge {
      font-size: var(--fs-xl);
      font-weight: 800;
      color: var(--c-primary);
    }

    .aide-amount-sub {
      font-size: var(--fs-xs);
      color: var(--c-muted);
    }

    .aide-chevron {
      color: var(--c-muted);
      transition: transform 300ms ease;
    }

    .aide-card.open .aide-chevron {
      transform: rotate(180deg);
    }

    /* ── Guided journey (accordion body) ── */
    .aide-journey {
      display: none;
      border-top: 1px solid var(--c-border);
      padding: var(--sp-6);
      background: var(--c-bg);
    }

    .aide-card.open .aide-journey {
      display: block;
    }

    .journey-title {
      font-size: var(--fs-base);
      font-weight: 700;
      color: var(--c-text);
      margin-bottom: var(--sp-4);
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }

    .journey-step {
      display: flex;
      gap: var(--sp-4);
      margin-bottom: var(--sp-5);
      position: relative;
    }

    .journey-step:not(:last-child)::before {
      content: '';
      position: absolute;
      left: 15px;
      top: 32px;
      bottom: -12px;
      width: 2px;
      background: var(--c-border);
    }

    .journey-step-num {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--c-primary);
      color: #fff;
      font-size: var(--fs-sm);
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      z-index: 1;
    }

    .journey-step-body { flex: 1; }

    .journey-step-title {
      font-size: var(--fs-sm);
      font-weight: 700;
      color: var(--c-text);
      margin-bottom: var(--sp-1);
    }

    .journey-step-desc {
      font-size: var(--fs-sm);
      color: var(--c-muted);
      margin-bottom: var(--sp-2);
    }

    .journey-step-link {
      display: inline-flex;
      align-items: center;
      gap: var(--sp-1);
      font-size: var(--fs-sm);
      color: var(--c-primary);
      text-decoration: none;
      font-weight: 600;
    }

    .journey-step-link:hover { text-decoration: underline; }

    .journey-cta {
      margin-top: var(--sp-5);
      padding-top: var(--sp-5);
      border-top: 1px solid var(--c-border);
      display: flex;
      gap: var(--sp-3);
      flex-wrap: wrap;
    }

    /* ── Actions bar ── */
    .results-actions {
      position: sticky;
      bottom: 0;
      background: var(--c-surface);
      border-top: 1px solid var(--c-border);
      padding: var(--sp-4) var(--sp-6);
      display: flex;
      justify-content: center;
      gap: var(--sp-3);
      flex-wrap: wrap;
      z-index: var(--z-sticky);
      box-shadow: 0 -4px 12px rgb(0 0 0 / .06);
    }

    /* ── Empty state ── */
    .no-results {
      text-align: center;
      padding: var(--sp-16) var(--sp-4);
    }

    .no-results p { color: var(--c-muted); margin-bottom: var(--sp-6); }

    /* ── Section heading ── */
    .results-section-title {
      font-size: var(--fs-sm);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--c-muted);
      margin: var(--sp-8) 0 var(--sp-4);
    }
  </style>
</head>
<body>
  <!-- Skip nav -->
  <a href="#main-content" class="sr-only">Aller au contenu</a>

  <!-- Header -->
  <header style="background:var(--c-surface);border-bottom:1px solid var(--c-border);padding:var(--sp-4) var(--sp-6);display:flex;align-items:center;justify-content:space-between;">
    <a href="/" style="display:flex;align-items:center;gap:var(--sp-2);text-decoration:none;color:var(--c-primary);font-weight:700;font-size:var(--fs-lg);" aria-label="Accueil">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Mes Aides</span>
    </a>
    <a href="simulateur.html" style="font-size:var(--fs-sm);color:var(--c-muted);text-decoration:none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle;margin-right:4px;" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      Modifier mes reponses
    </a>
  </header>

  <!-- Results hero -->
  <div class="results-header" id="resultsHero">
    <h1 data-i18n="results.title">Vos aides estimees</h1>
    <p data-i18n="results.subtitle">Sur la base de votre situation, vous etes potentiellement eligible a :</p>
    <div class="results-total">
      <span class="results-total-amount" id="totalAmount">—</span>
      <span class="results-total-label" data-i18n="results.per_month">€ / mois</span>
    </div>
  </div>

  <!-- Main -->
  <main id="main-content" class="results-body">
    <div id="aidesList">
      <!-- Populated by JS -->
      <div style="text-align:center;padding:var(--sp-16) 0;color:var(--c-muted);">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:0 auto var(--sp-4);" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        Calcul en cours…
      </div>
    </div>
  </main>

  <!-- Bottom bar -->
  <div class="results-actions" id="actionsBar" style="display:none;">
    <button class="btn btn-outline" onclick="window.print()" id="btnPrint">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      <span data-i18n="results.print">Imprimer</span>
    </button>
    <button class="btn btn-outline" onclick="shareResults()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      <span data-i18n="results.share">Partager</span>
    </button>
    <a href="simulateur.html" class="btn btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg>
      <span data-i18n="results.refine">Affiner ma simulation</span>
    </a>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/resultats.js"></script>
</body>
</html>
