            "acceptedAnswer": { "@type": "Answer", "text": "Avant le coup d'État de février 2021, le Myanmar disposait d'une pension de vieillesse de K 10 000 par mois versée uniquement aux anciens fonctionnaires et aux travailleurs du secteur formel enregistrés. Il n'existait pas de pension vieillesse universelle. La couverture était très limitée : moins de 5% de la population âgée bénéficiait d'une pension régulière. Le programme Ahlin Paing (transfert de cash) était à l'état de pilote dans quelques townships. Source : MSWRR 2020." }

          </table>
        </div>
      </section>

      <!-- FAQ -->
      <section class="section" aria-labelledby="faq-title">
        <h2 class="section__title" id="faq-title">Questions fréquentes sur la protection sociale au Myanmar</h2>
        <ul class="faq-list" role="list">
          <li>
            <details class="faq-item" role="listitem">
              <summary class="faq-question">
                <span>Quelle était la pension vieillesse au Myanmar avant 2021 ?</span>
                <svg class="faq-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </summary>
              <div class="faq-answer">
                <p>Avant le coup d'État de février 2021, le Myanmar disposait d'une pension de vieillesse de K 10 000 par mois versée uniquement aux anciens fonctionnaires et travailleurs formels. Il n'existait pas de pension universelle. Moins de 5% de la population âgée bénéficiait d'une pension régulière.</p>
                <p>Le programme pilote Ahlin Paing de transfert de cash couvrait quelques townships mais n'était pas déployé à l'échelle nationale. Source : MSWRR 2020.</p>
              </div>
            </details>
          </li>
          <li>
            <details class="faq-item" role="listitem">
              <summary class="faq-question">
                <span>Comment le coup d'État de 2021 a-t-il affecté la protection sociale au Myanmar ?</span>
                <svg class="faq-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </summary>
              <div class="faq-answer">
                <p>Le coup d'État militaire du 1er février 2021 a provoqué l'effondrement de nombreux programmes de protection sociale. Les transferts monétaires ont été suspendus, les services de santé publics se sont dégradés avec la grève civile du personnel médical.</p>
                <p>Les déplacements de populations ont créé de nouveaux besoins humanitaires massifs. L'OCHA estime à plus de 2 millions le nombre de déplacés internes en 2025. Les données officielles ne sont plus disponibles.</p>
              </div>
            </details>
          </li>
          <li>
            <details class="faq-item" role="listitem">
              <summary class="faq-question">
                <span>Quelle aide humanitaire le WFP (PAM) fournit-il au Myanmar ?</span>
                <svg class="faq-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </summary>
              <div class="faq-answer">
                <p>Le Programme Alimentaire Mondial (WFP/PAM) est l'une des rares organisations humanitaires à maintenir une présence opérationnelle au Myanmar. En 2025, le WFP assiste environ 3 millions de personnes vulnérables avec des rations alimentaires ou des transferts en espèces dans les zones accessibles.</p>
                <p>L'accès humanitaire reste sévèrement restreint par les autorités militaires. Source : wfp.org/countries/myanmar.</p>
              </div>
            </details>
          </li>
          <li>
            <details class="faq-item" role="listitem">
              <summary class="faq-question">
                <span>Comment le HCR (UNHCR) aide-t-il les déplacés internes au Myanmar ?</span>
                <svg class="faq-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </summary>
              <div class="faq-answer">
                <p>Le HCR coordonne l'assistance aux déplacés internes et réfugiés au Myanmar, dont le nombre a explosé depuis 2021. L'assistance inclut des abris d'urgence, des kits non alimentaires, de l'eau, l'assainissement et la protection.</p>
                <p>L'accès reste très difficile dans de nombreuses zones. Pour les situations d'urgence, contacter unhcr.org/myanmar. Source : unhcr.org/myanmar.</p>
              </div>
            </details>
          </li>
          <li>
            <details class="faq-item" role="listitem">
              <summary class="faq-question">
                <span>Quelle est la situation du microcrédit et de la microfinance au Myanmar depuis 2021 ?</span>
                <svg class="faq-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </summary>
              <div class="faq-answer">
                <p>Avant 2021, des organisations comme PACT et la MADB offraient des micro-crédits à des millions d'agriculteurs et de femmes rurales (500 000 à 2 millions de kyats). Ce secteur a largement soutenu les moyens de subsistance.</p>
                <p>Depuis le coup d'État, le secteur de la microfinance s'est effondré : nombreuses IMF ont suspendu leurs opérations, les remboursements sont compromis. La situation en 2025 est extrêmement précaire. Source : CGAP Myanmar reports.</p>
              </div>
            </details>
          </li>
        </ul>
      </section>
