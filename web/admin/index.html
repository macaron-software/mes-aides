<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Mes Aides</title>
  <link rel="stylesheet" href="/css/components.css">
  <style>
    .admin-shell { max-width:960px; margin:0 auto; padding:var(--sp-8) var(--sp-4); }
    .admin-header { display:flex; align-items:center; justify-content:space-between;
      border-bottom:1px solid var(--c-border); padding-bottom:var(--sp-4); margin-bottom:var(--sp-8); }
    .panel { background:var(--c-surface); border:1px solid var(--c-border);
      border-radius:var(--radius-lg); padding:var(--sp-6); margin-bottom:var(--sp-6); }
    .panel h2 { font-size:var(--text-lg); font-weight:var(--fw-bold); margin-bottom:var(--sp-4); }
    table { width:100%; border-collapse:collapse; font-size:var(--text-sm); }
    th,td { padding:var(--sp-2) var(--sp-3); text-align:left; border-bottom:1px solid var(--c-border); }
    th { font-weight:var(--fw-semibold); color:var(--c-text-muted); font-size:11px; text-transform:uppercase; letter-spacing:.05em; }
    .badge-role { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:var(--fw-medium); }
    .badge-admin { background:var(--c-accent-light); color:var(--c-accent-hover); }
    .badge-user  { background:var(--c-primary-light); color:var(--c-primary-dark); }
    .badge-inactive { background:var(--c-danger-light); color:var(--c-danger); }
    #login-view, #admin-view { transition: opacity .15s; }
    .hidden { display:none !important; }
    .stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:var(--sp-4); }
    .stat-card { background:var(--c-primary-light); border-radius:var(--radius-md); padding:var(--sp-4); text-align:center; }
    .stat-card .val { font-size:var(--text-3xl); font-weight:var(--fw-extrabold); color:var(--c-primary); }
    .stat-card .lbl { font-size:var(--text-sm); color:var(--c-text-muted); margin-top:var(--sp-1); }
    .form-row { display:grid; gap:var(--sp-3); margin-bottom:var(--sp-4); }
    .inline-form { display:flex; gap:var(--sp-3); align-items:flex-end; flex-wrap:wrap; }
    .inline-form .form-field { flex:1; min-width:180px; }
    .error-msg { color:var(--c-danger); font-size:var(--text-sm); margin-top:var(--sp-2); }
    .success-msg { color:var(--c-success); font-size:var(--text-sm); margin-top:var(--sp-2); }
  </style>
</head>
<body>

<!-- ══ LOGIN ══════════════════════════════════════════════════════════════════ -->
<div id="login-view" class="admin-shell" style="max-width:420px">
  <div style="text-align:center;margin-bottom:var(--sp-8)">
    <a href="/" style="text-decoration:none">
      <div style="font-size:var(--text-2xl);font-weight:var(--fw-extrabold);color:var(--c-primary)">Mes Aides</div>
    </a>
    <div style="color:var(--c-text-muted);margin-top:var(--sp-1)">Administration</div>
  </div>
  <div class="panel">
    <h2>Connexion</h2>
    <form id="login-form">
      <div class="form-field" style="margin-bottom:var(--sp-4)">
        <label class="form-label">Email</label>
        <input id="f-email" type="email" class="form-input" autocomplete="username" required>
      </div>
      <div class="form-field" style="margin-bottom:var(--sp-6)">
        <label class="form-label">Mot de passe</label>
        <input id="f-pwd" type="password" class="form-input" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Se connecter</button>
      <div id="login-error" class="error-msg hidden"></div>
    </form>
  </div>
</div>

<!-- ══ ADMIN DASHBOARD ════════════════════════════════════════════════════════ -->
<div id="admin-view" class="admin-shell hidden">

  <div class="admin-header">
    <div>
      <a href="/" style="text-decoration:none;font-weight:var(--fw-bold);color:var(--c-primary)">Mes Aides</a>
      <span style="color:var(--c-border);margin:0 8px">/</span>
      <span style="color:var(--c-text-muted)">Admin</span>
    </div>
    <div style="display:flex;align-items:center;gap:var(--sp-4)">
      <span id="admin-email" style="font-size:var(--text-sm);color:var(--c-text-muted)"></span>
      <button class="btn btn-secondary" onclick="logout()">Déconnexion</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="panel">
    <h2>Vue d'ensemble</h2>
    <div id="stats-grid" class="stat-grid">
      <div class="stat-card"><div class="val" id="stat-users">—</div><div class="lbl">Utilisateurs</div></div>
      <div class="stat-card"><div class="val" id="stat-version">—</div><div class="lbl">Version API</div></div>
    </div>
  </div>

  <!-- Create user -->
  <div class="panel">
    <h2>Créer un utilisateur</h2>
    <form id="create-form" class="inline-form">
      <div class="form-field inline-form__field">
        <label class="form-label">Email</label>
        <input id="new-email" type="email" class="form-input" placeholder="user@example.com" required>
      </div>
      <div class="form-field inline-form__field">
        <label class="form-label">Mot de passe</label>
        <input id="new-pwd" type="password" class="form-input" placeholder="min. 8 caractères" required minlength="8">
      </div>
      <div class="form-field" style="width:120px">
        <label class="form-label">Rôle</label>
        <select id="new-role" class="form-input">
          <option value="user">user</option>
          <option value="admin">admin</option>
        </select>
      </div>
      <div style="padding-top:22px">
        <button type="submit" class="btn btn-primary">Créer</button>
      </div>
    </form>
    <div id="create-msg" class="hidden" style="margin-top:var(--sp-3)"></div>
  </div>

  <!-- Users table -->
  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--sp-4)">
      <h2 style="margin-bottom:0">Utilisateurs</h2>
      <button class="btn btn-secondary" onclick="loadUsers()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-right:4px"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        Actualiser
      </button>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>Email</th>
            <th>Rôle</th>
            <th>Statut</th>
            <th>Créé le</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="users-tbody">
          <tr><td colspan="5" style="color:var(--c-text-subtle);padding:var(--sp-6);text-align:center">Chargement…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
const API = '';

// ── Token storage ─────────────────────────────────────────────────────────────
function getTokens() {
  try { return JSON.parse(localStorage.getItem('ma_admin') || 'null'); } catch { return null; }
}
function setTokens(data) { localStorage.setItem('ma_admin', JSON.stringify(data)); }
function clearTokens() { localStorage.removeItem('ma_admin'); }

// ── Auth headers ──────────────────────────────────────────────────────────────
function authHeaders() {
  const t = getTokens();
  return t ? { 'Authorization': `Bearer ${t.access_token}`, 'Content-Type': 'application/json' }
           : { 'Content-Type': 'application/json' };
}

// ── API calls ──────────────────────────────────────────────────────────────────
async function apiCall(method, path, body) {
  const opts = { method, headers: authHeaders() };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  if (res.status === 401) {
    // Try refresh
    const tokens = getTokens();
    if (tokens?.refresh_token) {
      const r = await fetch(API + '/api/auth/refresh', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: tokens.refresh_token })
      });
      if (r.ok) {
        const newTokens = await r.json();
        setTokens(newTokens);
        // Retry original request
        opts.headers = authHeaders();
        return fetch(API + path, opts);
      }
    }
    showLogin();
    throw new Error('Session expirée');
  }
  return res;
}

// ── Views ─────────────────────────────────────────────────────────────────────
function showLogin() {
  document.getElementById('login-view').classList.remove('hidden');
  document.getElementById('admin-view').classList.add('hidden');
}

function showAdmin() {
  const tokens = getTokens();
  document.getElementById('login-view').classList.add('hidden');
  document.getElementById('admin-view').classList.remove('hidden');
  if (tokens?.user?.email) {
    document.getElementById('admin-email').textContent = tokens.user.email;
  }
  loadStats();
  loadUsers();
}

// ── Login ─────────────────────────────────────────────────────────────────────
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('login-error');
  errEl.classList.add('hidden');
  const btn = e.target.querySelector('button[type=submit]');
  btn.disabled = true;
  btn.textContent = 'Connexion…';
  try {
    const res = await fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('f-email').value,
        password: document.getElementById('f-pwd').value
      })
    });
    const data = await res.json();
    if (!res.ok) {
      errEl.textContent = data.error || 'Erreur de connexion';
      errEl.classList.remove('hidden');
      return;
    }
    if (data.user?.role !== 'admin') {
      errEl.textContent = 'Accès réservé aux administrateurs';
      errEl.classList.remove('hidden');
      return;
    }
    setTokens(data);
    showAdmin();
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Se connecter';
  }
});

// ── Logout ────────────────────────────────────────────────────────────────────
async function logout() {
  const tokens = getTokens();
  if (tokens?.refresh_token) {
    fetch(API + '/api/auth/logout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: tokens.refresh_token })
    }).catch(() => {});
  }
  clearTokens();
  showLogin();
}

// ── Stats ──────────────────────────────────────────────────────────────────────
async function loadStats() {
  try {
    const res = await apiCall('GET', '/api/admin/stats');
    if (!res.ok) return;
    const data = await res.json();
    document.getElementById('stat-users').textContent = data.total_users ?? '—';
    document.getElementById('stat-version').textContent = data.version ?? '—';
  } catch {}
}

// ── Users ──────────────────────────────────────────────────────────────────────
async function loadUsers() {
  const tbody = document.getElementById('users-tbody');
  tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--c-text-subtle);padding:var(--sp-6)">Chargement…</td></tr>';
  try {
    const res = await apiCall('GET', '/api/admin/users');
    if (!res.ok) return;
    const users = await res.json();
    if (!users.length) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--c-text-subtle);padding:var(--sp-6)">Aucun utilisateur</td></tr>';
      return;
    }
    tbody.innerHTML = users.map(u => `
      <tr>
        <td style="font-weight:var(--fw-medium)">${escHtml(u.email)}</td>
        <td><span class="badge-role badge-${u.role}">${u.role}</span></td>
        <td>${u.active
          ? '<span style="color:var(--c-success);font-size:var(--text-sm)">Actif</span>'
          : '<span class="badge-role badge-inactive">Désactivé</span>'
        }</td>
        <td style="color:var(--c-text-muted);font-size:var(--text-sm)">${u.created_at?.slice(0,16) ?? '—'}</td>
        <td>
          <button class="btn btn-secondary" style="padding:2px 8px;font-size:12px" onclick="toggleUser('${u.id}',${!u.active})">
            ${u.active ? 'Désactiver' : 'Activer'}
          </button>
          <button class="btn" style="padding:2px 8px;font-size:12px;background:var(--c-danger-light);color:var(--c-danger);border:none;margin-left:4px;cursor:pointer;border-radius:var(--radius-sm)" onclick="deleteUser('${u.id}','${escHtml(u.email)}')">
            Supprimer
          </button>
        </td>
      </tr>
    `).join('');
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="5" style="color:var(--c-danger);padding:var(--sp-6)">${err.message}</td></tr>`;
  }
}

async function deleteUser(id, email) {
  if (!confirm(`Supprimer l'utilisateur "${email}" ? Cette action est irréversible.`)) return;
  try {
    const res = await apiCall('DELETE', `/api/admin/users/${id}`);
    if (res.ok || res.status === 204) { loadUsers(); loadStats(); }
    else {
      const d = await res.json().catch(() => ({}));
      alert(d.error || 'Erreur lors de la suppression');
    }
  } catch (err) { alert(err.message); }
}

async function toggleUser(id, active) {
  try {
    const res = await apiCall('POST', `/api/admin/users/${id}/active`, { active });
    if (res.ok) loadUsers();
  } catch (err) { alert(err.message); }
}

// ── Create user ────────────────────────────────────────────────────────────────
document.getElementById('create-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msgEl = document.getElementById('create-msg');
  msgEl.className = 'hidden';
  msgEl.textContent = '';
  try {
    const res = await apiCall('POST', '/api/auth/register', {
      email: document.getElementById('new-email').value,
      password: document.getElementById('new-pwd').value,
      role: document.getElementById('new-role').value
    });
    const data = await res.json();
    if (res.ok) {
      msgEl.className = 'success-msg';
      msgEl.textContent = `Utilisateur ${data.email} créé avec le rôle ${data.role}.`;
      e.target.reset();
      loadUsers(); loadStats();
    } else {
      msgEl.className = 'error-msg';
      msgEl.textContent = data.error || 'Erreur';
    }
  } catch (err) {
    msgEl.className = 'error-msg';
    msgEl.textContent = err.message;
  }
  msgEl.classList.remove('hidden');
});

// ── Utils ──────────────────────────────────────────────────────────────────────
function escHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// ── Init ───────────────────────────────────────────────────────────────────────
(function init() {
  const tokens = getTokens();
  if (tokens?.access_token && tokens?.user?.role === 'admin') {
    showAdmin();
  } else {
    showLogin();
  }
})();
</script>
</body>
</html>
