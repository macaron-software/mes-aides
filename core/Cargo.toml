[package]
name = "aides-core"
version.workspace = true
edition.workspace = true

[lib]
name = "aides_core"
crate-type = ["cdylib", "rlib", "staticlib"]   # cdylib for WASM & FFI, rlib for Axum, staticlib for iOS

[features]
default = []
wasm = ["wasm-bindgen", "js-sys", "console_error_panic_hook"]
ffi  = ["uniffi"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true

# WASM (feature-gated)
wasm-bindgen      = { version = "0.2", optional = true }
js-sys            = { version = "0.3", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

# UniFFI (feature-gated) — iOS + Android native bindings
uniffi = { version = "0.28", features = ["build", "bindgen"], optional = true }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"], optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"
criterion = "0.5"

[[bench]]
name = "simulation"
harness = false
